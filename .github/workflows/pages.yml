name: pages

# 只发布仓库根的 privacy/（隐私政策、示例字幕），拼出的 URL 为 /privacy/。
# 站点目录在根目录，但 artifact 只取它，仓库源码不会被 Pages 公开。
on:
  push:
    branches: [main]
    paths:
      - 'privacy/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir -p _site && cp -r privacy _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
