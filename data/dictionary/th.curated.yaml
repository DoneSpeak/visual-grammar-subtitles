schemaVersion: 1
language: th

# Thai → Chinese learning lexicon.
#
# Every entry is drafted AI-assisted (`reviewedBy: claude-assisted`) and marked
# `reviewStatus: approved`, matching python/vocabulary/data/concepts/ja.yaml.
# Only `approved` entries reach public/dict/th/lexicon.json. Public releases must
# be spot-checked by a human; change `reviewedBy` to whoever signs off.
#
# `pos` is a UPOS tag. `en` is optional: without it the build takes English glosses
# from the kaikki.org Thai extract. Expand the list in this file and rerun
# `pnpm lexicon:build th`.

